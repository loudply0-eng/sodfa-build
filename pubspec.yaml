publish_to: "none"
version: 0.1.8+9
environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  flutter_secure_storage: ^11.2.0
  http: ^1.2.2
  package_info_plus: ^8.0.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - docs/CHANGELOG.json
