name: SODFA Secure Android Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Confirm a signed release build from the private source main branch"
        required: true
        type: boolean
        default: false
      source_ref:
        description: "Exact private source commit to build (40-character SHA); main is allowed for manual releases"
        required: false
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: sodfa-secure-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirm_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: sodfa-production
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://sodfa:sodfa_ci_only@127.0.0.1:5432/sodfa
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ISSUER: https://api.sodfa.test
      JWT_AUDIENCE: sodfa-test
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_FROM: '"SODFA" <no-reply@sodfa.test>'
      SODFA_API_INTEGRATION: '1'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sodfa
          POSTGRES_USER: sodfa
          POSTGRES_PASSWORD: sodfa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sodfa -d sodfa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Validate required production configuration
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.SODFA_PROD_SOURCE_READ_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SODFA_PROD_ANDROID_KEYSTORE_BASE64: ${{ secrets.SODFA_PROD_ANDROID_KEYSTORE_BASE64 }}
          SODFA_PROD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SODFA_PROD_ANDROID_KEYSTORE_PASSWORD }}
          SODFA_PROD_ANDROID_KEY_ALIAS: ${{ secrets.SODFA_PROD_ANDROID_KEY_ALIAS }}
          SODFA_PROD_ANDROID_KEY_PASSWORD: ${{ secrets.SODFA_PROD_ANDROID_KEY_PASSWORD }}
          UPDATE_PRIVATE_KEY_PEM: ${{ secrets.SODFA_PROD_UPDATE_PRIVATE_KEY_PEM }}
          UPDATE_PUBLIC_KEY_BASE64: ${{ vars.SODFA_PROD_UPDATE_PUBLIC_KEY_BASE64 }}
          DEPLOY_HOST: ${{ secrets.SODFA_PROD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SODFA_PROD_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SODFA_PROD_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SODFA_PROD_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in SOURCE_TOKEN SODFA_PROD_ANDROID_KEYSTORE_BASE64 SODFA_PROD_ANDROID_KEYSTORE_PASSWORD SODFA_PROD_ANDROID_KEY_ALIAS SODFA_PROD_ANDROID_KEY_PASSWORD UPDATE_PRIVATE_KEY_PEM UPDATE_PUBLIC_KEY_BASE64 DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required production setting: $name"
              exit 1
            fi
          done
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          if ! [[ "$SOURCE_REF" =~ ^([0-9a-f]{40}|main)$ ]]; then
            echo "::error::source_ref must be main or a full 40-character commit SHA."
            exit 1
          fi

      - name: Checkout private SODFA source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: loudply0-eng/sodfa-
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SODFA_PROD_SOURCE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js 26
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: source/server/api/package.json

      - name: Install private API dependencies
        working-directory: source/server/api
        shell: bash
        run: |
          set -euo pipefail
          if ! npm install --no-audit --no-fund > "$RUNNER_TEMP/sodfa-api-install.log" 2>&1; then
            echo "::error::Private API dependency installation failed; private logs are suppressed."
            exit 1
          fi

      - name: Audit production API dependencies
        working-directory: source/server/api
        shell: bash
        run: |
          set -euo pipefail
          if ! npm audit --omit=dev --audit-level=high > "$RUNNER_TEMP/sodfa-api-audit.log" 2>&1; then
            echo "::error::The API production dependency audit found a high-severity advisory or could not complete."
            exit 1
          fi

      - name: Apply API database migrations
        working-directory: source/server/api
        shell: bash
        run: |
          set -euo pipefail
          JWT_SECRET="$(openssl rand -hex 32)" npm run migrate > "$RUNNER_TEMP/sodfa-api-migrate.log" 2>&1 || {
            echo "::error::Private API database migrations failed; private logs are suppressed."
            exit 1
          }

      - name: Run API unit and PostgreSQL/Redis integration tests
        working-directory: source/server/api
        shell: bash
        run: |
          set -euo pipefail
          JWT_SECRET="$(openssl rand -hex 32)" npm test > "$RUNNER_TEMP/sodfa-api-tests.log" 2>&1 || {
            echo "::error::API unit or PostgreSQL/Redis integration tests failed; private logs are suppressed."
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: source
        run: |
          set -euo pipefail
          if ! flutter pub get > "$RUNNER_TEMP/sodfa-pub-get.log" 2>&1; then
            echo "::error::Dependency installation failed. Private source logs are not exposed in this public builder."
            exit 1
          fi

      - name: Analyze private source
        working-directory: source
        run: |
          set -euo pipefail
          if ! flutter analyze --no-fatal-infos > "$RUNNER_TEMP/sodfa-analyze.log" 2>&1; then
            echo "::error::Flutter analysis failed. Private source logs are not exposed in this public builder."
            exit 1
          fi

      - name: Run private source tests
        working-directory: source
        run: |
          set -euo pipefail
          if ! flutter test > "$RUNNER_TEMP/sodfa-tests.log" 2>&1; then
            echo "::error::Flutter tests failed. Private source logs are not exposed in this public builder."
            exit 1
          fi

      - name: Prepare Android signing key
        shell: bash
        env:
          SODFA_PROD_ANDROID_KEYSTORE_BASE64: ${{ secrets.SODFA_PROD_ANDROID_KEYSTORE_BASE64 }}
          SODFA_PROD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SODFA_PROD_ANDROID_KEYSTORE_PASSWORD }}
          SODFA_PROD_ANDROID_KEY_ALIAS: ${{ secrets.SODFA_PROD_ANDROID_KEY_ALIAS }}
          SODFA_PROD_ANDROID_KEY_PASSWORD: ${{ secrets.SODFA_PROD_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$SODFA_PROD_ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > source/android/app/upload-keystore.jks
          test -s source/android/app/upload-keystore.jks
          keytool -list -v -keystore source/android/app/upload-keystore.jks \
            -alias "$SODFA_PROD_ANDROID_KEY_ALIAS" -storepass "$SODFA_PROD_ANDROID_KEYSTORE_PASSWORD" \
            > "$RUNNER_TEMP/sodfa-keystore-info.txt"
          ACTUAL_CERT="$(awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}' "$RUNNER_TEMP/sodfa-keystore-info.txt")"
          EXPECTED_CERT="369c770895b6f20830f5aa5891e0146623c92391c8589f73542cdd7fbe559ee2"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::The configured keystore does not match the registered SODFA release certificate."
            exit 1
          fi
          cat > source/android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$SODFA_PROD_ANDROID_KEYSTORE_PASSWORD
          keyAlias=$SODFA_PROD_ANDROID_KEY_ALIAS
          keyPassword=$SODFA_PROD_ANDROID_KEY_PASSWORD
          EOF
          chmod 600 source/android/key.properties source/android/app/upload-keystore.jks

      - name: Verify update signing key pair
        shell: bash
        env:
          SODFA_PROD_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.SODFA_PROD_UPDATE_PRIVATE_KEY_PEM }}
          SODFA_PROD_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.SODFA_PROD_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SODFA_PROD_UPDATE_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/sodfa-update-private.pem"
          chmod 600 "$RUNNER_TEMP/sodfa-update-private.pem"
          openssl pkey -in "$RUNNER_TEMP/sodfa-update-private.pem" -check -noout
          openssl pkey -in "$RUNNER_TEMP/sodfa-update-private.pem" -pubout -out "$RUNNER_TEMP/sodfa-update-public.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/sodfa-update-public.pem" -outform DER -out "$RUNNER_TEMP/sodfa-update-public.der"
          tail -c 32 "$RUNNER_TEMP/sodfa-update-public.der" | base64 -w0 > "$RUNNER_TEMP/sodfa-update-public.b64"
          ACTUAL_PUBLIC_KEY="$(cat "$RUNNER_TEMP/sodfa-update-public.b64")"
          if [ "$ACTUAL_PUBLIC_KEY" != "$SODFA_PROD_UPDATE_PUBLIC_KEY_BASE64" ]; then
            echo "::error::The Ed25519 public key variable does not match the private key secret."
            exit 1
          fi
          printf '%s' "$SODFA_PROD_UPDATE_PUBLIC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/sodfa-update-public.raw"
          test "$(wc -c < "$RUNNER_TEMP/sodfa-update-public.raw")" -eq 32

      - name: Build obfuscated signed APK
        working-directory: source
        shell: bash
        env:
          SODFA_UPDATE_MANIFEST_URL: https://mahmoudaljuorany.store/updates/sodfa/manifest.json
          SODFA_PROD_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.SODFA_PROD_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if ! flutter build apk --release --obfuscate \
            --split-debug-info="$RUNNER_TEMP/sodfa-symbols" \
            --dart-define=SODFA_UPDATE_MANIFEST_URL="$SODFA_UPDATE_MANIFEST_URL" \
            --dart-define=SODFA_UPDATE_PUBLIC_KEY_BASE64="$SODFA_PROD_UPDATE_PUBLIC_KEY_BASE64" \
            > "$RUNNER_TEMP/sodfa-release-build.log" 2>&1; then
            echo "::error::The signed release build failed. Private source build logs were intentionally not published."
            exit 1
          fi
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/sodfa-apk-signature.txt"
          ACTUAL_APK_CERT="$(awk -F': ' '/certificate SHA-256 digest/{gsub(/:/,"",$2); print tolower($2); exit}' "$RUNNER_TEMP/sodfa-apk-signature.txt")"
          EXPECTED_CERT="369c770895b6f20830f5aa5891e0146623c92391c8589f73542cdd7fbe559ee2"
          if [ "$ACTUAL_APK_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::The output APK certificate does not match the registered SODFA release certificate."
            exit 1
          fi

      - name: Create and sign the update manifest
        working-directory: source
        shell: bash
        env:
          SODFA_PROD_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.SODFA_PROD_UPDATE_PRIVATE_KEY_PEM }}
          SODFA_PROD_UPDATE_PUBLIC_KEY_BASE64: ${{ vars.SODFA_PROD_UPDATE_PUBLIC_KEY_BASE64 }}
          UPDATE_BASE_URL: https://mahmoudaljuorany.store/updates/sodfa
        run: |
          set -euo pipefail
          VERSION_LINE="$(awk '/^version:[[:space:]]*/ {sub(/^version:[[:space:]]*/, ""); gsub(/[[:space:]]/, ""); print; exit}' pubspec.yaml)"
          if ! [[ "$VERSION_LINE" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::pubspec.yaml must contain a semantic version and numeric build number."
            exit 1
          fi
          VERSION="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          APK_NAME="sodfa-$VERSION_LINE.apk"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_URL="$UPDATE_BASE_URL/$APK_NAME"
          export VERSION BUILD_NUMBER APK_URL APK_SHA256

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          with open("docs/CHANGELOG.json", encoding="utf-8") as source:
              changelog = json.load(source)
          releases = changelog.get("releases", [])
          matching = [
              item for item in releases
              if item.get("version") == os.environ["VERSION"]
              and int(item.get("build_number", -1)) == int(os.environ["BUILD_NUMBER"])
          ]
          if len(matching) != 1:
              raise SystemExit("CHANGELOG.json must contain exactly one entry matching pubspec.yaml.")
          release = matching[0]
          changes = release.get("changes")
          if not isinstance(changes, list) or not changes or not all(isinstance(x, str) and x.strip() for x in changes):
              raise SystemExit("The matching changelog entry must contain a non-empty list of changes.")
          manifest = {
              "application_id": "com.sodfa.sodfa",
              "platform": "android",
              "channel": "stable",
              "version": os.environ["VERSION"],
              "build_number": int(os.environ["BUILD_NUMBER"]),
              "apk_url": os.environ["APK_URL"],
              "sha256": os.environ["APK_SHA256"],
              "release_title": release.get("title", "تحديث جديد لصدفة"),
              "release_changes": changes,
              "release_notes": release.get("title", "تحديث جديد لتطبيق صدفة") + chr(10) * 2 + chr(10).join("• " + item for item in changes),
              "release_date": release.get("date", ""),
              "force_update": False,
              "min_supported_build": 1,
              "rollout_percentage": 100
          }
          Path("manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8"
          )
          PY

          printf '%s\n' "$SODFA_PROD_UPDATE_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/sodfa-update-private.pem"
          chmod 600 "$RUNNER_TEMP/sodfa-update-private.pem"
          openssl pkeyutl -sign -rawin \
            -inkey "$RUNNER_TEMP/sodfa-update-private.pem" \
            -in manifest.json \
            -out "$RUNNER_TEMP/manifest.sig.raw"
          base64 -w0 "$RUNNER_TEMP/manifest.sig.raw" > manifest.json.sig
          printf '\n' >> manifest.json.sig
          base64 -d manifest.json.sig > "$RUNNER_TEMP/manifest.sig.verify"
          cmp -s "$RUNNER_TEMP/manifest.sig.raw" "$RUNNER_TEMP/manifest.sig.verify"
          openssl pkeyutl -verify -rawin \
            -pubin -inkey "$RUNNER_TEMP/sodfa-update-public.pem" \
            -in manifest.json \
            -sigfile "$RUNNER_TEMP/manifest.sig.raw"
          test "$(wc -c < "$RUNNER_TEMP/manifest.sig.raw")" -eq 64

      - name: Upload signed release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sodfa-android-release
          path: source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed release and manifest to Oracle
        working-directory: source
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SODFA_PROD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SODFA_PROD_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SODFA_PROD_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SODFA_PROD_DEPLOY_KNOWN_HOSTS }}
          UPDATE_BASE_URL: https://mahmoudaljuorany.store/updates/sodfa
        run: |
          set -euo pipefail
          VERSION_LINE="$(awk '/^version:[[:space:]]*/ {sub(/^version:[[:space:]]*/, ""); gsub(/[[:space:]]/, ""); print; exit}' pubspec.yaml)"
          if ! [[ "$VERSION_LINE" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::Invalid version string."
            exit 1
          fi
          APK_NAME="sodfa-$VERSION_LINE.apk"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          REMOTE_DIR="/var/www/mahmoudaljuorany.store/updates/sodfa"
          REMOTE_APK_TMP="$REMOTE_DIR/.$APK_NAME.uploading"
          REMOTE_MANIFEST_TMP="$REMOTE_DIR/.manifest.json.uploading"
          REMOTE_SIG_TMP="$REMOTE_DIR/.manifest.json.sig.uploading"

          install -m 700 -d ~/.ssh
          python3 - <<'PY'
          import base64, os
          raw = os.environ["DEPLOY_SSH_KEY"].strip()
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ("'", '"'):
              raw = raw[1:-1]
          raw = raw.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\\r", "\n").replace("\r", "")
          if "-----BEGIN " not in raw:
              try:
                  decoded = base64.b64decode("".join(raw.split()), validate=True).decode("utf-8")
                  if "-----BEGIN " in decoded:
                      raw = decoded
              except Exception:
                  pass
          if "-----BEGIN " not in raw or "PRIVATE KEY-----" not in raw:
              raise SystemExit("Deployment SSH key must be a PEM or OpenSSH private key, or base64-encoded PEM.")
          with open(os.path.expanduser("~/.ssh/sodfa_deploy_key"), "w", encoding="utf-8", newline="\n") as key:
              key.write(raw.rstrip() + "\n")
          PY
          chmod 600 ~/.ssh/sodfa_deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/sodfa_deploy_key > /dev/null
          ssh-keygen -y -f ~/.ssh/sodfa_deploy_key > /dev/null

          scp -i ~/.ssh/sodfa_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            build/app/outputs/flutter-apk/app-release.apk \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_APK_TMP"
          scp -i ~/.ssh/sodfa_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            manifest.json "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_MANIFEST_TMP"
          scp -i ~/.ssh/sodfa_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            manifest.json.sig "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_SIG_TMP"

          # Publish the signature first and the manifest last. During the tiny
          # transition window, clients fail closed rather than accept a mismatch.
          ssh -i ~/.ssh/sodfa_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; \
             trap \"rm -f '$REMOTE_APK_TMP' '$REMOTE_SIG_TMP' '$REMOTE_MANIFEST_TMP'\" EXIT; \
             UPLOADED_SHA=\$(sha256sum '$REMOTE_APK_TMP' | awk '{print \$1}'); \
             test \"\$UPLOADED_SHA\" = '$APK_SHA256'; \
             if [ -e '$REMOTE_DIR/$APK_NAME' ]; then \
               EXISTING_SHA=\$(sha256sum '$REMOTE_DIR/$APK_NAME' | awk '{print \$1}'); \
               if [ \"\$EXISTING_SHA\" != '$APK_SHA256' ]; then \
                 echo 'Refusing to replace a published build number with different APK bytes.' >&2; \
                 exit 1; \
               fi; \
             fi; \
             mv '$REMOTE_APK_TMP' '$REMOTE_DIR/$APK_NAME'; \
             mv '$REMOTE_SIG_TMP' '$REMOTE_DIR/manifest.json.sig'; \
             mv '$REMOTE_MANIFEST_TMP' '$REMOTE_DIR/manifest.json'"


          curl --fail --silent --show-error --max-time 20 \
            "$UPDATE_BASE_URL/manifest.json" -o "$RUNNER_TEMP/sodfa-published-manifest.json"
          curl --fail --silent --show-error --max-time 20 \
            "$UPDATE_BASE_URL/manifest.json.sig" -o "$RUNNER_TEMP/sodfa-published-manifest.sig"
          cmp -s manifest.json "$RUNNER_TEMP/sodfa-published-manifest.json"
          cmp -s manifest.json.sig "$RUNNER_TEMP/sodfa-published-manifest.sig"
          echo "Signed SODFA release and manifest publication verified."

      - name: Remove signing material, source logs, and obfuscation symbols
        if: always()
        shell: bash
        run: |
          rm -f source/android/key.properties source/android/app/upload-keystore.jks
          rm -f ~/.ssh/sodfa_deploy_key
          rm -rf "$RUNNER_TEMP/sodfa-symbols"
          rm -f "$RUNNER_TEMP/sodfa-update-private.pem" "$RUNNER_TEMP/sodfa-update-public.pem"
          rm -f "$RUNNER_TEMP/sodfa-update-public.der" "$RUNNER_TEMP/sodfa-update-public.raw"
          rm -f "$RUNNER_TEMP/sodfa-update-public.b64" "$RUNNER_TEMP/manifest.sig.raw"
          rm -f "$RUNNER_TEMP/manifest.sig.verify" "$RUNNER_TEMP/sodfa-pub-get.log"
          rm -f "$RUNNER_TEMP/sodfa-analyze.log" "$RUNNER_TEMP/sodfa-tests.log"
          rm -f "$RUNNER_TEMP/sodfa-release-build.log" "$RUNNER_TEMP/sodfa-keystore-info.txt"
          rm -f "$RUNNER_TEMP/sodfa-apk-signature.txt"
          rm -f "$RUNNER_TEMP"/sodfa-api-*.log
          rm -f "$RUNNER_TEMP/sodfa-published-manifest.json" "$RUNNER_TEMP/sodfa-published-manifest.sig"
          rm -f source/manifest.json source/manifest.json.sig
