name: SODFA Public Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodfa-public-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build test APK
        run: flutter build apk --debug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: sodfa-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing signing secret::$name is not configured in the public build repository."
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::error::The decoded Android keystore is empty or invalid."
            exit 1
          fi
          keytool -list -v -keystore android/app/upload-keystore.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /tmp/sodfa-keystore-info.txt
          ACTUAL_CERT="$(awk -F': ' '/SHA256:/{gsub(/:/,"",$2); print tolower($2); exit}' /tmp/sodfa-keystore-info.txt)"
          EXPECTED_CERT="369c770895b6f20830f5aa5891e0146623c92391c8589f73542cdd7fbe559ee2"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error title=Wrong signing key::The keystore certificate does not match the registered SODFA release key."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/key.properties android/app/upload-keystore.jks

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          SODFA_UPDATE_MANIFEST_URL: https://mahmoudaljuorany.store/updates/sodfa/manifest.json
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          set +e
          flutter build apk --release --dart-define=SODFA_UPDATE_MANIFEST_URL="$SODFA_UPDATE_MANIFEST_URL" 2>&1 | tee /tmp/sodfa-build-first.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            if grep -q "Cannot recover key" /tmp/sodfa-build-first.log; then
              echo "Retrying with the verified keystore password for the private key."
              cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF
              chmod 600 android/key.properties
              flutter build apk --release --dart-define=SODFA_UPDATE_MANIFEST_URL="$SODFA_UPDATE_MANIFEST_URL"
            else
              exit "$BUILD_STATUS"
            fi
          fi

      - name: Verify release APK signature
        if: github.event_name != 'pull_request'
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sodfa-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable release to Oracle update server
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOST: ${{ secrets.SODFA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.SODFA_DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.SODFA_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.SODFA_DEPLOY_KNOWN_HOSTS }}
          UPDATE_BASE_URL: https://mahmoudaljuorany.store/updates/sodfa
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing deployment secret: $name"
              exit 1
            fi
          done

          VERSION_LINE="$(awk '/^version:[[:space:]]*/ {sub(/^version:[[:space:]]*/, ""); gsub(/[[:space:]]/, ""); print; exit}' pubspec.yaml)"
          if [[ "$VERSION_LINE" != *+* ]]; then
            echo "::error::pubspec.yaml version must include a build number, e.g. 0.1.9+10"
            exit 1
          fi
          VERSION="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Android build number in pubspec.yaml"
            exit 1
          fi

          APK_NAME="sodfa-${VERSION}+${BUILD_NUMBER}.apk"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_URL="$UPDATE_BASE_URL/$APK_NAME"
          export VERSION BUILD_NUMBER APK_URL APK_SHA256

          install -m 700 -d ~/.ssh
          # Normalize common GitHub-secret formats: multiline PEM, escaped newlines, or base64 PEM.
          python3 - <<'PY'
          import base64, os
          raw = os.environ["DEPLOY_SSH_KEY"].strip()
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ("'", '"'):
              raw = raw[1:-1]
          raw = raw.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\\r", "\n").replace("\r", "")
          if "-----BEGIN " not in raw:
              try:
                  decoded = base64.b64decode("".join(raw.split()), validate=True).decode("utf-8")
                  if "-----BEGIN " in decoded:
                      raw = decoded
              except Exception:
                  pass
          if "-----BEGIN " not in raw or "PRIVATE KEY-----" not in raw:
              raise SystemExit("DEPLOY_SSH_KEY is not a recognized PEM private key; store the private key as multiline PEM or base64-encoded PEM.")
          with open(os.path.expanduser("~/.ssh/sodfa_deploy_key"), "w", encoding="utf-8", newline="\\n") as key:
              key.write(raw.rstrip() + "\\n")
          PY
          chmod 600 ~/.ssh/sodfa_deploy_key
          # Validate the decoded private key before attempting network access.
          ssh-keygen -y -f ~/.ssh/sodfa_deploy_key > ~/.ssh/sodfa_deploy_key.pub
          ssh-keygen -lf ~/.ssh/sodfa_deploy_key.pub
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          python3 - <<'PY'
          import json, os
          with open("docs/CHANGELOG.json", encoding="utf-8") as source:
              changelog = json.load(source)
          matching = [item for item in changelog.get("releases", [])
                      if item.get("version") == os.environ["VERSION"]
                      and int(item.get("build_number", -1)) == int(os.environ["BUILD_NUMBER"])]
          if len(matching) != 1:
              raise SystemExit("CHANGELOG.json must contain exactly one entry matching this release version and build number.")
          release = matching[0]
          changes = release.get("changes", [])
          if not isinstance(changes, list) or not changes or not all(isinstance(item, str) and item.strip() for item in changes):
              raise SystemExit("The matching changelog entry must contain a non-empty list of change descriptions.")
          manifest = {
              "application_id": "com.sodfa.sodfa",
              "platform": "android",
              "channel": "stable",
              "version": os.environ["VERSION"],
              "build_number": int(os.environ["BUILD_NUMBER"]),
              "apk_url": os.environ["APK_URL"],
              "sha256": os.environ["APK_SHA256"],
              "release_title": release.get("title", "تحديث جديد لصدفة"),
              "release_changes": changes,
              "release_notes": release.get("title", "تحديث جديد لتطبيق صدفة") + chr(10) * 2 + chr(10).join("• " + item for item in changes),
              "release_date": release.get("date", ""),
              "force_update": False,
              "min_supported_build": 1,
              "rollout_percentage": 100
          }
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

          REMOTE_DIR="/var/www/mahmoudaljuorany.store/updates/sodfa"
          REMOTE_APK_TMP="$REMOTE_DIR/.$APK_NAME.uploading"
          REMOTE_MANIFEST_TMP="$REMOTE_DIR/.manifest.json.uploading"
          scp -i ~/.ssh/sodfa_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$APK" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_APK_TMP"
          scp -i ~/.ssh/sodfa_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes manifest.json "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_MANIFEST_TMP"
          ssh -i ~/.ssh/sodfa_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "set -e; mv '$REMOTE_APK_TMP' '$REMOTE_DIR/$APK_NAME'; mv '$REMOTE_MANIFEST_TMP' '$REMOTE_DIR/manifest.json'"

          echo "Published $APK_NAME (SHA-256: $APK_SHA256)"

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks
