name: SODFA Private Source Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private source branch to validate; the exact commit is checked against expected_source_sha"
        required: true
        type: string
        default: "main"
      expected_source_sha:
        description: "Exact 40-character private source commit SHA expected after checkout"
        required: true
        type: string
      confirm_validation:
        description: "Confirm a secret-free validation run"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sodfa-source-validation
  cancel-in-progress: false

jobs:
  validate:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_validation == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'loudply0-eng' && contains(github.event.head_commit.message, '[sodfa-validation]'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: sodfa-validation
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://sodfa:sodfa_ci_only@127.0.0.1:5432/sodfa
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ISSUER: https://api.sodfa.test
      JWT_AUDIENCE: sodfa-test
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_FROM: '"SODFA" <no-reply@sodfa.test>'
      SODFA_API_INTEGRATION: '1'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sodfa
          POSTGRES_USER: sodfa
          POSTGRES_PASSWORD: sodfa_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sodfa -d sodfa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Validate source ref and read-only token
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'release/signed-update-manifest-0.1.9-build10' }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || '258697ca6329479b14f259bb16d2e2b831921ce9' }}
          SOURCE_TOKEN: ${{ secrets.SODFA_VALIDATION_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::SODFA_VALIDATION_SOURCE_READ_TOKEN is missing from the protected environment."
            exit 1
          fi
          if ! git check-ref-format --branch "$SOURCE_REF" >/dev/null 2>&1; then
            echo "::error::source_ref must be a valid private source branch name."
            exit 1
          fi
          if ! [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_source_sha must be a full 40-character lowercase commit SHA."
            exit 1
          fi

      - name: Checkout selected private source ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: loudply0-eng/sodfa-
          ref: refs/heads/${{ inputs.source_ref || 'release/signed-update-manifest-0.1.9-build10' }}
          token: ${{ secrets.SODFA_VALIDATION_SOURCE_READ_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact private source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha || '258697ca6329479b14f259bb16d2e2b831921ce9' }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          echo "Checked out source commit: $ACTUAL_SOURCE_SHA"
          if [ "$ACTUAL_SOURCE_SHA" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "::error::Private source branch moved or resolved to a different commit; refusing to test an unpinned source."
            exit 1
          fi

      - name: Validate private workflow syntax and public-builder-only execution
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts "Valid YAML: #{path}" }' source/.github/workflows/*.yml
          python3 - <<'PY'
          from pathlib import Path

          workflows_dir = Path("source/.github/workflows")
          private_runner_workflows = [
              "sodfa-api-ci.yml",
              "sodfa-ci.yml",
              "sodfa-release-dispatch.yml",
          ]
          present = [name for name in private_runner_workflows if (workflows_dir / name).exists()]
          if present:
              raise SystemExit(
                  "Private paid-runner workflows must remain removed; run SODFA validation "
                  "and release from the public sodfa-build repository: " + ", ".join(present)
              )

          for path in sorted(workflows_dir.glob("*.yml")):
              text = path.read_text(encoding="utf-8")
              trigger_section = text.split("permissions:", 1)[0]
              if "  push:" in trigger_section or "  pull_request:" in trigger_section:
                  raise SystemExit(
                      f"Private workflow {path.name} must not start paid Actions jobs on push or pull_request."
                  )
              if "  workflow_dispatch:" not in trigger_section:
                  raise SystemExit(
                      f"Private operations workflow {path.name} must be explicitly manual-only."
                  )

          print("Private workflow syntax passed; app CI, validation, and release are delegated to public sodfa-build.")
          PY

      - name: Set up Node.js 26
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "26"

      - name: Install private API dependencies
        working-directory: source/server/api
        shell: bash
        run: |
          set -euo pipefail
          if ! npm install --no-audit --no-fund > "$RUNNER_TEMP/sodfa-api-install.log" 2>&1; then
            echo "::error::Private API dependency installation failed; private logs are suppressed."
            exit 1
          fi
          echo "API dependency installation passed."

      - name: Audit production API dependencies
        working-directory: source/server/api
        shell: bash
        run: |
          set -euo pipefail
          if ! npm audit --omit=dev --audit-level=high > "$RUNNER_TEMP/sodfa-api-audit.log" 2>&1; then
            echo "::error::The API production dependency audit found a high-severity advisory or could not complete."
            exit 1
          fi
          echo "API production dependency audit passed."

      - name: Apply API database migrations
        working-directory: source/server/api
        shell: bash
        run: |
          set -euo pipefail
          if ! JWT_SECRET="$(openssl rand -hex 32)" npm run migrate > "$RUNNER_TEMP/sodfa-api-migrate.log" 2>&1; then
            echo "::error::Private API database migrations failed; private logs are suppressed."
            exit 1
          fi
          echo "API database migrations passed."

      - name: Run API unit and PostgreSQL/Redis integration tests
        working-directory: source/server/api
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/sodfa-safe-test-reporter.mjs" <<'REPORTER'
          const allowedNames = new Set([
            'AssertionError', 'TypeError', 'ReferenceError', 'RangeError',
            'SyntaxError', 'Error', 'TimeoutError', 'AbortError', 'FastifyError',
          ]);
          const allowedOperators = new Set([
            'strictEqual', 'notStrictEqual', 'deepStrictEqual', 'notDeepStrictEqual',
            'equal', 'notEqual', 'deepEqual', 'notDeepEqual', 'ok', 'match',
            'doesNotMatch', 'throws', 'doesNotThrow', 'rejects', 'doesNotReject',
          ]);
          const safeScalar = (value) =>
            value === null ||
            typeof value === 'boolean' ||
            (typeof value === 'number' && Number.isFinite(value));

          export default async function* sodfaSafeReporter(events) {
            for await (const event of events) {
              if (event.type !== 'test:fail') continue;
              const details = event.data?.details ?? {};
              const errorChain = [];
              const seen = new Set();
              let current = details.error;

              for (let depth = 0; current && depth < 4 && !seen.has(current); depth += 1) {
                seen.add(current);
                const item = {};
                if (allowedNames.has(current.name)) item.name = current.name;
                if (typeof current.code === 'string' && /^ERR_[A-Z0-9_]{1,48}$/.test(current.code)) {
                  item.code = current.code;
                }
                if (allowedOperators.has(current.operator)) item.operator = current.operator;
                for (const key of ['expected', 'actual']) {
                  if (Object.hasOwn(current, key) && safeScalar(current[key])) item[key] = current[key];
                }
                if (typeof current.stack === 'string') {
                  const frames = [...current.stack.matchAll(
                    /\/source\/server\/api\/((?:src|test)\/[^()\s]+?\.js):(\d+):(\d+)/g,
                  )]
                    .map((match) => match[1] + ':' + match[2])
                    .filter((value, index, all) => all.indexOf(value) === index)
                    .slice(0, 6);
                  if (frames.length) item.frames = frames;
                }
                if (Object.keys(item).length) errorChain.push(item);
                const cause = current.cause;
                current = cause && typeof cause === 'object' ? cause : null;
              }

              const testPath = String(event.data?.file ?? '').match(
                /\/source\/server\/api\/((?:src|test)\/[^:\s]+\.js)$/,
              );
              const report = {
                failureType: typeof details.type === 'string' && /^[A-Za-z]+$/.test(details.type)
                  ? details.type
                  : 'unknown',
                testLocation: testPath ? testPath[1] + ':' + (Number(event.data?.line) || 0) : 'not available',
                errorChain,
              };
              yield JSON.stringify(report) + '\n';
            }
          }
          REPORTER

          export SODFA_SAFE_DIAGNOSTIC_FILE="$RUNNER_TEMP/sodfa-safe-diagnostic.json"
          if ! JWT_SECRET="$(openssl rand -hex 32)" npm test -- --test-reporter="$RUNNER_TEMP/sodfa-safe-test-reporter.mjs" > "$RUNNER_TEMP/sodfa-api-tests.log" 2>&1; then
            node - "$RUNNER_TEMP/sodfa-api-tests.log" <<'NODE'
          const fs = require('node:fs');
          const output = fs.readFileSync(process.argv[2], 'utf8');
          const reports = output.split(/\r?\n/).filter(Boolean).flatMap((line) => {
            try {
              const value = JSON.parse(line);
              return value && typeof value === 'object' ? [value] : [];
            } catch {
              return [];
            }
          });
          const unique = (values) => [...new Set(values.filter((value) => typeof value === 'string'))];
          const failures = reports.filter((report) => report.failureType);
          const errors = failures.flatMap((report) => Array.isArray(report.errorChain) ? report.errorChain : []);
          const names = unique(errors.map((item) => item.name));
          const codes = unique(errors.map((item) => item.code));
          const operators = unique(errors.map((item) => item.operator));
          const frames = unique(errors.flatMap((item) => Array.isArray(item.frames) ? item.frames : [])).slice(0, 12);
          const scalarPairs = errors
            .filter((item) => Object.hasOwn(item, 'expected') || Object.hasOwn(item, 'actual'))
            .map((item) => {
              const expected = Object.hasOwn(item, 'expected') ? String(item.expected) : '?';
              const actual = Object.hasOwn(item, 'actual') ? String(item.actual) : '?';
              return 'expected=' + expected + ',actual=' + actual;
            });
          const locations = unique(failures.map((item) => item.testLocation)).slice(0, 5);
          console.error('Private API test failure count: ' + failures.length);
          console.error('Private API failure categories: ' + unique(failures.map((item) => item.failureType)).join(', '));
          console.error('Private API root error names: ' + (names.join(', ') || 'not available'));
          console.error('Private API root error codes: ' + (codes.join(', ') || 'not available'));
          console.error('Private API assertion operators: ' + (operators.join(', ') || 'not available'));
          console.error('Private API safe scalar values: ' + (unique(scalarPairs).slice(0, 5).join('; ') || 'not available'));
          console.error('Private API test locations: ' + (locations.join(', ') || 'not available'));
          console.error('Private API source frames: ' + (frames.join(', ') || 'not available'));
          try {
            const direct = JSON.parse(fs.readFileSync(process.env.SODFA_SAFE_DIAGNOSTIC_FILE, 'utf8'));
            const chain = Array.isArray(direct.chain) ? direct.chain : [];
            console.error('Private API direct-caught error chain: ' + JSON.stringify(chain));
          } catch {
            console.error('Private API direct-caught error chain: not available');
          }
          NODE
            echo "::error::API unit or PostgreSQL/Redis integration tests failed; private test names, messages, string values, and full stack traces remain suppressed."
            exit 1
          fi
          echo "API unit and PostgreSQL/Redis integration tests passed."

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.50.0"
          channel: stable

      - name: Install dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if ! flutter pub get > "$RUNNER_TEMP/sodfa-pub-get.log" 2>&1; then
            echo "::error::Private source dependency installation failed; private logs are suppressed."
            exit 1
          fi
          echo "Dependency installation passed."

      - name: Analyze
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if ! flutter analyze --no-fatal-infos > "$RUNNER_TEMP/sodfa-analyze.log" 2>&1; then
            python3 - "$RUNNER_TEMP/sodfa-analyze.log" <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import sys

          log = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          pattern = re.compile(
              r"^\\s*(error|warning|info)\\s+•\\s+.*?\\s+•\\s+"
              r"((?:lib|test|integration_test)/[A-Za-z0-9_./-]+\\.dart):"
              r"(\\d+):(\\d+)(?:\\s+•\\s+([a-z0-9_]+))?\\s*$"
          )
          diagnostics = []
          for line in log.splitlines():
              match = pattern.match(line)
              if not match:
                  continue
              severity, path, row, column, code = match.groups()
              if ".." in Path(path).parts:
                  continue
              diagnostics.append((severity, path, row, column, code or "code-not-reported"))

          counts = Counter(item[0] for item in diagnostics)
          print("Sanitized Flutter analysis diagnostic count: " + str(len(diagnostics)))
          print("Severity counts: " + ", ".join(
              f"{level}={counts[level]}" for level in ("error", "warning", "info") if counts[level]
          ))
          for severity, path, row, column, code in diagnostics[:40]:
              print(f"{severity}: {path}:{row}:{column} [{code}]")
          if not diagnostics:
              count = sum(1 for line in log.splitlines() if re.search(r"\\b(error|warning)\\b", line, re.I))
              print("Unparsed diagnostic-like lines: " + str(count))
          PY
            echo "::error::Private source analysis failed; source messages and code remain suppressed."
            exit 1
          fi
          echo "Flutter analysis passed."

      - name: Run tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if ! flutter test > "$RUNNER_TEMP/sodfa-tests.log" 2>&1; then
            echo "::error::Private source tests failed; private logs are suppressed."
            exit 1
          fi
          echo "Flutter tests passed."

      - name: Build debug APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if ! flutter build apk --debug > "$RUNNER_TEMP/sodfa-debug-build.log" 2>&1; then
            echo "::error::Private source debug build failed; private logs are suppressed."
            exit 1
          fi
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo "Debug APK build passed."

      - name: Create ephemeral release signing key
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          CI_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore android/app/ci-release-smoke.jks \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEYSTORE_PASSWORD" \
            -alias ci-release-smoke \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=SODFA CI smoke test" > "$RUNNER_TEMP/sodfa-ci-keytool.log" 2>&1
          cat > android/key.properties <<EOF
          storeFile=ci-release-smoke.jks
          storePassword=$CI_KEYSTORE_PASSWORD
          keyAlias=ci-release-smoke
          keyPassword=$CI_KEYSTORE_PASSWORD
          EOF
          chmod 600 android/key.properties android/app/ci-release-smoke.jks

      - name: Build obfuscated release validation APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if ! flutter build apk --release --obfuscate \
            --split-debug-info="$RUNNER_TEMP/sodfa-symbols" \
            --dart-define=SODFA_UPDATE_MANIFEST_URL=https://mahmoudaljuorany.store/updates/sodfa/manifest.json \
            --dart-define=SODFA_UPDATE_PUBLIC_KEY_BASE64= \
            > "$RUNNER_TEMP/sodfa-release-build.log" 2>&1; then
            echo "::error::Private source obfuscated release build failed; private logs are suppressed."
            exit 1
          fi
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK" > "$RUNNER_TEMP/sodfa-smoke-signature.log" 2>&1
          echo "Obfuscated release validation build passed."

      - name: Remove ephemeral files and private logs
        if: always()
        shell: bash
        run: |
          rm -f source/android/key.properties source/android/app/ci-release-smoke.jks
          rm -rf "$RUNNER_TEMP/sodfa-symbols"
          rm -f "$RUNNER_TEMP"/sodfa-*.log
          rm -f "$RUNNER_TEMP"/sodfa-api-*.log
